[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-core"
version = "0.1.0"
description = "RECALL Core Memory Manager - Persistent memory engine for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dipankar", email = "dipankar@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]
mcp = [
    "mcp>=1.28,<2",
]
semantic = [
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.0,<6",
]

[project.scripts]
recall-mcp = "recall_mcp.server:main"
recall-api = "core.recall_core.api:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["core", "core.recall_core*", "contracts*", "database*", "intelligence*", "recall_mcp*"]